name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Node 24 migration: actions/checkout@v4 and actions/setup-python@v5 were upgraded below.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and development dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: python -m ruff check app.py src tests

      - name: Check Ruff formatting
        run: python -m ruff format --check app.py src tests

      - name: Run 14-module strict static typing
        run: |
          python -m mypy \
            src/performance.py \
            src/adapters.py \
            src/field_detection.py \
            src/field_mapping.py \
            src/standardization.py \
            src/analysis_bridge.py \
            src/limits.py \
            src/data_loader.py \
            src/file_import.py \
            src/reference_files.py \
            src/comparison.py \
            src/reporting.py \
            src/templates.py \
            src/run_manifest.py \
            --strict \
            --show-error-codes

      - name: Run tests with branch coverage
        run: python -m pytest --cov=src --cov-branch --cov-report=term-missing

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python files
        run: python -m compileall app.py src tests

      - name: Check release readiness
        shell: bash
        run: |
          python -c "from src.config import APP_VERSION; assert APP_VERSION == '0.2.0'; print('APP_VERSION=' + APP_VERSION)"
          test -f requirements.txt
          test -f requirements-dev.txt
          test -f scripts/check_quality.bat
          test -f docs/ENGINEERING_QUALITY.md
          git diff --check
          test -z "$(git status --porcelain)"
